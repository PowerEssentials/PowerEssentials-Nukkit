[main]
prefix=[PowerEssentials]
name=ENGLISH UNITED STATES
errorCommandConsole=Please use this command in-game!
errorPlayerNotFound=Player with the name %0 not found.
errorPluginNotFound=Plugin %0 not found.  
errorNoPermission="You don't have permission to use this feature."
errorCommandCooldown=You can use this command again in %0 seconds.

[fly]
prefix=[Fly]
description=Command to fly.
usage=/fly [player]
enabled=Fly enabled.
disabled=Fly disabled.
othersEnabled=Fly enabled for %0.
othersDisabled=Fly disabled for %0.

[fperm]
prefix=[FPerm]
description=Retrieve plugin permission info.
usage=/fperm <plugin name>
result=Plugin %0 has permission %1: %2

[heal]
prefix=[Heal]
description=Healing for player.
usage=/heal [player]
healed=Successfully healed.
othersHealed=Succesfully healed %0.


[feed]
prefix=[Feed]
description=Feeding for player.
usage=/feed [player]
feeded=Successfully feeded.
othersFeeded=Succesfully feeded %0.

[gamemode]
prefix=[Gamemode]
description=Change gamemode for player.
usage=/gmc [player], /gms [player], /gmsp [player], /gma [player]
changed=Gamemode changed to %0.
othersChanged=Gamemode changed to %0 for %1.

